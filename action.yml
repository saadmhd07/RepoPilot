name: "RepoPilot"
description: "Review a GitHub pull request with OpenAI and post a structured comment."
author: "saadmhd07"

inputs:
  github-token:
    description: "GitHub token with pull request read/write permissions."
    required: true
  openai-api-key:
    description: "OpenAI API key used for the review."
    required: true
  model:
    description: "OpenAI model to use for the review."
    required: false
    default: "gpt-5.2"
  post:
    description: "Whether to post the review back to the pull request."
    required: false
    default: "true"
  max-files:
    description: "Maximum number of changed files sent to the model."
    required: false
    default: "40"
  max-patch-chars:
    description: "Maximum patch size per file."
    required: false
    default: "12000"
  max-total-chars:
    description: "Maximum combined review context size."
    required: false
    default: "45000"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install RepoPilot
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run RepoPilot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        REPOPILOT_MAX_FILES: ${{ inputs.max-files }}
        REPOPILOT_MAX_PATCH_CHARS: ${{ inputs.max-patch-chars }}
        REPOPILOT_MAX_TOTAL_CHARS: ${{ inputs.max-total-chars }}
      run: |
        set -euo pipefail
        args=(review --from-github-event --model "${{ inputs.model }}")
        if [[ "${{ inputs.post }}" == "true" ]]; then
          args+=(--post)
        fi
        repopilot "${args[@]}"
